# The demo surface, and the reason there is no CORS middleware in this repo.
#
# The browser loads the app and calls the agent through the same origin: this
# server answers `/` with the built assets and forwards `/api/` to the agent
# container. Same origin means no preflight, no Access-Control-Allow-*, and no
# security posture invented for a demo and then inherited by production.
#
# The Vite dev server does the same thing with `server.proxy`, so the frontend
# only ever writes relative paths (`/api/threads`, `/api/healthz`) and works
# unchanged in both places.

server {
    # nginx-unprivileged deliberately binds above the privileged port range.
    listen 8080;
    server_name _;

    # -----------------------------------------------------------------------
    # The API, and the streaming constraint
    # -----------------------------------------------------------------------
    # Both trailing slashes matter and are load-bearing as a pair: with a
    # trailing slash on the proxy_pass target, nginx replaces the matched
    # `/api/` prefix rather than appending it, so `/api/threads` reaches the
    # agent as `/threads`. Drop either slash and every request arrives as
    # `/api/threads` and 404s.
    location /api/ {
        proxy_pass http://agent:8080/;

        # Everything below exists for POST /threads/{id}/turns/stream, which is
        # Server-Sent Events. nginx buffers proxied responses by default, so
        # without proxy_buffering off it holds the entire event stream and
        # flushes it in one blob when the turn finishes. The pipeline still
        # completes and the payloads are all correct — the stages just arrive
        # simultaneously at the end. Anyone debugging that will look at the
        # frontend first and find nothing wrong there. Do not remove these.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # The single-page app
    # -----------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Client-side routing: a deep link or a refresh asks this server for a
        # path only the browser's router knows about. Falling back to
        # index.html lets the app boot and resolve the route itself, instead of
        # nginx returning 404 for a page that exists.
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable by construction — Vite renames the file
    # whenever its contents change — so they can be cached hard. index.html
    # must not be, or a browser keeps loading an old bundle after a deploy.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
